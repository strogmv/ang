<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANG · Location SDK</title>
<style>
:root{color-scheme:dark;--ink:#d8dedf;--dim:#91a0a5;--line:#36454d;--panel:#172127;--accent:#c7ab76;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c1318;color:var(--ink)}header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:23px;font-weight:550;margin:5px 0}small,.dim{color:var(--dim)}.brand{letter-spacing:.16em;font-size:11px;color:var(--accent)}button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);padding:9px 13px;border-radius:5px;cursor:pointer}button:hover,select:focus{border-color:var(--accent)}main{display:grid;grid-template-columns:235px minmax(300px,1fr) 310px;min-height:calc(100vh - 100px)}aside{padding:22px 18px;background:#111b21;border-right:1px solid var(--line)}aside.right{border-right:0;border-left:1px solid var(--line)}h2{font-size:14px;letter-spacing:.03em;margin:0 0 14px}#levels{display:grid;gap:8px;margin-bottom:25px}#levels button{text-align:left;overflow-wrap:anywhere;font-size:13px}button[aria-pressed=true]{border-color:var(--accent);color:#f4ddb3;background:#332f25}label{display:block;font-size:13px;margin:13px 0}input{accent-color:var(--accent);margin-right:8px}section.stage{padding:18px;display:flex;flex-direction:column;min-width:0}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-bottom:14px}.toolbar label{margin:0;font-size:12px}.viewport{min-height:440px;flex:1;background:radial-gradient(ellipse at 50% 45%,#202d34,#10191f 75%);border:1px solid var(--line);border-radius:8px;position:relative}svg{width:100%;height:100%;min-height:520px;display:block}svg polygon,svg path,svg line{vector-effect:non-scaling-stroke}.tile{cursor:pointer}.tile:hover{stroke:#f3ce87!important;stroke-width:2}.stats{display:flex;gap:18px;flex-wrap:wrap;padding:14px 1px;font-size:12px;color:var(--dim)}.tag{border:1px solid #40535d;border-radius:4px;padding:5px 8px;color:#a9c9b6;font-size:11px}.legend{display:flex;gap:15px;font-size:11px;flex-wrap:wrap;margin:12px 0;color:var(--dim)}.swatch{display:inline-block;width:8px;height:8px;margin-right:5px}pre{font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#c6d2d6}#why{font-size:14px;line-height:1.6}#selection{color:var(--accent);font-size:14px;overflow-wrap:anywhere}.note{font-size:12px;line-height:1.65;margin-top:20px;border-top:1px solid var(--line);padding-top:15px}.probe{margin-top:20px;width:100%;font-size:12px}.hash{font:11px ui-monospace,monospace;overflow-wrap:anywhere}.status{font-size:12px;min-height:18px;color:#d1b582}@media(max-width:1000px){main{grid-template-columns:185px minmax(250px,1fr)}aside.right{grid-column:1/-1;border-top:1px solid var(--line)}svg{min-height:440px}}@media(max-width:650px){main{display:block}aside{border-bottom:1px solid var(--line)}#levels{grid-template-columns:repeat(3,1fr)}header{padding:14px}h1{font-size:18px}}
@media(min-width:1001px){body{height:100vh;display:flex;flex-direction:column}header{flex:0 0 auto}main{flex:1;min-height:0;overflow:hidden}aside{min-height:0;overflow:auto}.stage{min-height:0}.viewport{min-height:0;overflow:hidden}svg{min-height:0;height:100%;position:absolute;inset:0}.stats{flex:0 0 auto}}
</style></head><body>
<header><div><div class="brand">ANG / LOCATION SDK</div><h1 data-text="heading"></h1><small data-text="subtitle"></small></div><select id="locale" aria-label="Language"><option value="ru">Русский</option><option value="en">English</option></select></header>
<main><aside><h2 data-text="layouts"></h2><div id="levels"></div><h2 data-text="layers"></h2>
<label><input type="checkbox" id="volumes" checked><span data-text="volumes"></span></label>
<label><input type="checkbox" id="access" checked><span data-text="access"></span></label>
<label><input type="checkbox" id="paths" checked><span data-text="paths"></span></label>
<label><input type="checkbox" id="ports" checked><span data-text="ports"></span></label>
<label><input type="checkbox" id="barriers" checked><span data-text="barriers"></span></label>
<button id="probe" class="probe" data-text="probe"></button><p class="note" data-text="instructions"></p><div class="hash" id="hash"></div></aside>
<section class="stage"><div class="toolbar"><label data-text="time"></label><select id="time"></select><label data-text="event"></label><select id="event"></select><span class="tag" id="invariant"></span></div><div class="viewport"><svg id="view" role="img" aria-label="Compiled location geometry"></svg></div><div class="legend"><span><i class="swatch" style="background:#638775"></i><span data-text="use"></span></span><span><i class="swatch" style="background:#6a8da3"></i><span data-text="service"></span></span><span><i class="swatch" style="background:#c6a567"></i><span data-text="reserved"></span></span><span><i class="swatch" style="background:#df9477"></i><span data-text="edge"></span></span></div><div class="status" id="status"></div><div class="stats" id="stats"></div></section>
<aside class="right"><h2 data-text="inspector"></h2><div id="selection"></div><p id="why"></p><pre id="details"></pre><p class="note" data-text="limits"></p></aside></main>
<script type="application/json" id="compiled">__LOCATION_SDK_DATA__</script>
<script>
'use strict';
const bundle=JSON.parse(document.getElementById('compiled').textContent),$=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
const labels={ru:{heading:'Одна геометрия · разные состояния',subtitle:'CUE → проверка размещения → схема для осмотра',layouts:'Локации из общего каталога',layers:'Показать',volumes:'Объёмы модулей',access:'Подход и обслуживание',paths:'Свободные проходы',ports:'Точки соединения',barriers:'Обоснованные ограждения',probe:'Проверить маршрут',instructions:'Нажмите на модуль, подход или ограждение: справа появится причина размещения. Для пробы маршрута выберите две свободные клетки.',time:'Время',event:'Событие',use:'Использование',service:'Обслуживание',reserved:'Проход',edge:'Перепад высоты',inspector:'Почему здесь этот элемент',limits:'Это инструмент проверки геометрии. Условные объёмы не являются игровыми спрайтами. Компиляция пока не заменяет существующие локации Unity и не подтверждает инженерные нормы.',same:'Геометрия сохранена',different:'ОШИБКА: геометрия отличается',select:'Выберите элемент',walk:'Свободный пол',blocked:'Занятая клетка',first:'Выберите начало маршрута',second:'Выберите конец маршрута',noRoute:'Между выбранными клетками нет прохода',route:'Длина пути',cells:'клеток',objects:'модулей',rails:'ограждений',unit:'Шаг',meters:'м',day:'День',night:'Ночь',ordinary:'Обычный день',holiday:'Праздник'},en:{heading:'One geometry · different states',subtitle:'CUE → placement validation → inspection view',layouts:'Layouts from a shared catalogue',layers:'Show',volumes:'Module volumes',access:'Use and maintenance access',paths:'Reserved circulation',ports:'Connection points',barriers:'Justified barriers',probe:'Check a route',instructions:'Select a module, clearance or barrier to see its reason. Choose two free cells to probe a route.',time:'Time',event:'Event',use:'Use',service:'Maintenance',reserved:'Circulation',edge:'Height difference',inspector:'Why this element is here',limits:'Geometry inspection tool. Diagram volumes are not game sprites. Compilation does not yet replace the existing Unity locations or certify engineering standards.',same:'Geometry preserved',different:'ERROR: geometry differs',select:'Select an element',walk:'Free floor',blocked:'Occupied cell',first:'Choose a route start',second:'Choose a route end',noRoute:'There is no route between these cells',route:'Path length',cells:'cells',objects:'modules',rails:'barriers',unit:'Unit',meters:'m',day:'Day',night:'Night',ordinary:'Ordinary',holiday:'Holiday'}};
let locale='ru',index=0,selected=null,probing=false,start=null,route=[];
const t=k=>labels[locale][k]||k, arr=v=>v||[],key=p=>p.x+','+p.y;
function elem(tag,attrs={},parent=$('view')){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));parent.appendChild(e);return e}
function point(x,y,z=0){return [(x-y)*20,(x+y)*10-z*22]}
function poly(points,attrs,parent){return elem('polygon',{points:points.map(p=>p.join(',')).join(' '),...attrs},parent)}
function cell(p,z=0){return [point(p.x,p.y,z),point(p.x+1,p.y,z),point(p.x+1,p.y+1,z),point(p.x,p.y+1,z)]}
function textNode(at,text,color='#d7c8a8',parent){const e=elem('text',{x:at[0],y:at[1],'text-anchor':'middle','font-size':9,fill:color,'pointer-events':'none'},parent);e.textContent=text;return e}
function inspect(record){selected=record;$('selection').textContent=record.id||record.instance_id||'';$('why').textContent=record.reason||record.kind||'';$('details').textContent=JSON.stringify(record,null,2)}
function options(id,values,previous){const select=$(id);select.replaceChildren();for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=t(v.replace(/^(time|event)\./,''));select.append(o)}if(values.includes(previous))select.value=previous;else {const preferred=id==='time'?'day':'ordinary';if(values.includes(preferred))select.value=preferred}}
function setup(){document.documentElement.lang=locale;document.querySelectorAll('[data-text]').forEach(e=>e.textContent=t(e.dataset.text));$('levels').replaceChildren();bundle.levels.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l.id;b.setAttribute('aria-pressed',i===index);b.onclick=()=>{index=i;selected=null;start=null;route=[];setup()};$('levels').append(b)});const l=bundle.levels[index];options('time',[...new Set(arr(l.views).map(v=>v.time_id))],$('time').value);options('event',[...new Set(arr(l.views).map(v=>v.event_id))],$('event').value);if(selected)inspect(selected);else{$('selection').textContent=t('select');$('why').textContent='';$('details').textContent=''}render()}
function routeBetween(l,a,b){const q=[a],seen=new Set([key(a)]),prev=new Map();for(let i=0;i<q.length;i++){const p=q[i];if(key(p)===key(b)){const out=[p];while(key(out.at(-1))!==key(a))out.push(prev.get(key(out.at(-1))));return out.reverse()}for(const[dX,dY]of [[0,-1],[1,0],[0,1],[-1,0]]){const n={x:p.x+dX,y:p.y+dY},k=key(n);if(l.terrain[n.y]?.[n.x]!=='.'||seen.has(k))continue;seen.add(k);prev.set(k,p);q.push(n)}}return []}
function chooseCell(l,p){if(!probing){const item=arr(l.instances).find(i=>arr(i.footprint).some(c=>key(c)===key(p))),floor=arr(l.preview?.floor).find(f=>key(f.at)===key(p));inspect(item||{id:floor?.source_id||key(p),at:p,reason:floor?.reason,kind:l.terrain[p.y]?.[p.x]==='.'?t('walk'):t('blocked')});return}if(l.terrain[p.y]?.[p.x]!=='.')return;if(!start){start=p;route=[];$('status').textContent=t('second')}else{route=routeBetween(l,start,p);$('status').textContent=route.length?t('route')+': '+((route.length-1)*l.unit_mm/1000).toFixed(1)+' '+t('meters'):t('noRoute');start=null}render()}
function render(){const l=bundle.levels[index],view=$('view');view.replaceChildren();const state=arr(l.views).find(v=>v.time_id===$('time').value&&v.event_id===$('event').value);$('invariant').textContent=state?.structural_hash===l.structural_hash?t('same'):t('different');$('hash').textContent='geometry / '+l.structural_hash;$('stats').textContent=[l.width*l.unit_mm/1000+' × '+l.depth*l.unit_mm/1000+' '+t('meters'),t('unit')+' '+l.unit_mm/1000+' '+t('meters'),arr(l.instances).length+' '+t('objects'),arr(l.barriers).length+' '+t('rails')].join(' · ');
const maxHeight=Math.max(0,...arr(l.instances).map(i=>i.height)),corners=[point(0,0,maxHeight),point(l.width,0),point(0,l.depth),point(l.width,l.depth)];const minX=Math.min(...corners.map(p=>p[0]))-55,maxX=Math.max(...corners.map(p=>p[0]))+55,minY=Math.min(...corners.map(p=>p[1]))-40,maxY=Math.max(...corners.map(p=>p[1]))+40;view.setAttribute('viewBox',`${minX} ${minY} ${maxX-minX} ${maxY-minY}`);const world=elem('g',{opacity:state?.brightness??1});
for(const f of arr(l.preview?.floor)){const p=f.at;const e=poly(cell(p),{class:'tile',fill:l.terrain[p.y]?.[p.x]==='#'?'#434c50':'#354852',stroke:'#58707c','stroke-width':.45},world);e.onclick=()=>chooseCell(l,p)}
if($('paths').checked)for(const p of arr(l.reserved_paths))for(const c of arr(p.cells)){const e=poly(cell(c),{fill:'#c4a163','fill-opacity':.18,stroke:'#c4a163','stroke-opacity':.3,'stroke-width':.45},world);e.onclick=()=>probing?chooseCell(l,c):inspect(p)}
if($('access').checked)for(const c of arr(l.clearances))for(const p of arr(c.cells)){const col=c.kind.includes('maintenance')?'#78b5dc':'#8ed4a1';const e=poly(cell(p),{fill:col,'fill-opacity':.15,stroke:col,'stroke-width':.8},world);e.onclick=()=>probing?chooseCell(l,p):inspect(c)}
for(const item of [...arr(l.instances)].sort((a,b)=>(a.at.x+a.at.y)-(b.at.x+b.at.y))){const group=elem('g',{},world);for(const p of arr(item.footprint)){const h=$('volumes').checked?item.height:0,b=cell(p),top=cell(p,h);if(h){poly([b[1],b[2],top[2],top[1]],{fill:'#33434b',stroke:'#71818a','stroke-width':.6},group);poly([b[2],b[3],top[3],top[2]],{fill:'#27373f',stroke:'#71818a','stroke-width':.6},group)}poly(top,{fill:selected?.id===item.id?'#ad9567':'#6b7d85',stroke:'#a1b0b5','stroke-width':.65},group)}group.style.cursor='pointer';group.onclick=()=>{inspect(item);render()}}
if($('ports').checked)for(const p of arr(l.ports)){for(const opening of arr(p.opening)){const mark=poly(cell(opening),{fill:'#7ee4d6','fill-opacity':.35,stroke:'#7ee4d6','stroke-width':1},world);mark.onclick=()=>inspect({...p,reason:arr(l.instances).find(i=>i.id===p.instance_id)?.reason})}const at=point(p.at.x+.5,p.at.y+.5);const e=elem('circle',{cx:at[0],cy:at[1],r:4,fill:'#7ee4d6',stroke:'#142b32','stroke-width':1},world);e.onclick=()=>inspect({...p,reason:arr(l.instances).find(i=>i.id===p.instance_id)?.reason});textNode([at[0],at[1]-7],p.id,'#aee9e2',world)}
if($('barriers').checked)for(const b of arr(l.barriers)){const p=b.at,edges={north:[[p.x,p.y],[p.x+1,p.y]],east:[[p.x+1,p.y],[p.x+1,p.y+1]],south:[[p.x,p.y+1],[p.x+1,p.y+1]],west:[[p.x,p.y],[p.x,p.y+1]]},ends=edges[b.side];if(!ends)continue;const a=point(...ends[0],2),c=point(...ends[1],2),g=elem('g',{},world);for(const endpoint of ends){const base=point(...endpoint),top=point(...endpoint,2);elem('line',{x1:base[0],y1:base[1],x2:top[0],y2:top[1],stroke:'#ce926f','stroke-width':2},g)}elem('line',{x1:a[0],y1:a[1],x2:c[0],y2:c[1],stroke:'#edb18a','stroke-width':3},g);g.onclick=()=>inspect(b);g.style.cursor='pointer'}
for(const d of arr(state?.decorations)){const at=point(d.at.x+.5,d.at.y+.5,d.z-l.elevation);const e=elem('rect',{x:at[0]-9,y:at[1]-3,width:18,height:6,rx:1,fill:state.accent_color||'#d9bb7f'},world);e.onclick=()=>inspect(d)}
if(route.length){elem('polyline',{points:route.map(p=>point(p.x+.5,p.y+.5).join(',')).join(' '),fill:'none',stroke:'#f7d391','stroke-width':3,'pointer-events':'none'},world)}if(start){const at=point(start.x+.5,start.y+.5);elem('circle',{cx:at[0],cy:at[1],r:4,fill:'#f7d391'},world)}
}
$('locale').onchange=()=>{locale=$('locale').value;setup()};for(const id of ['time','event','volumes','access','paths','ports','barriers'])$(id).onchange=render;$('probe').onclick=()=>{probing=!probing;start=null;route=[];$('probe').setAttribute('aria-pressed',probing);$('status').textContent=probing?t('first'):'';render()};setup();
</script></body></html>
