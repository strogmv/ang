version: "3"

tasks:
  bootstrap:
    desc: Install missing local dependencies where possible
    cmds:
      - bash scripts/bootstrap.sh

  deps:
    desc: Run preflight checks
    cmds:
      - bash scripts/preflight.sh

  up:
    desc: Run full local bootstrap
    deps: [deps]
    cmds:
      - ang up

  dev:
    desc: Start local dependencies only
    cmds:
      - bash scripts/dev-up.sh

  down:
    desc: Stop local dependencies
    cmds:
      - bash scripts/dev-down.sh

  build:
    desc: Generate code from CUE intent
    deps: [deps]
    cmds:
      - ang build

  validate:
    desc: Validate CUE intent
    cmds:
      - ang validate

  lint:
    desc: Run semantic flow lint checks
    cmds:
      - ang lint

  doctor:
    desc: Preflight + doctor checks with actionable fixes
    cmds:
      - bash scripts/doctor.sh

  smoke:
    desc: Check local health endpoints
    cmds:
      - bash scripts/dev-smoke.sh

  reset:
    desc: Drop local runtime state
    cmds:
      - bash scripts/dev-reset.sh
