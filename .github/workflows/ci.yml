name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  determinism-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determinism Matrix Check (plan/apply/all)
        run: go run ./scripts/determinism_ci

  go:
    runs-on: ubuntu-latest
    needs: determinism-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Build ANG CLI
        run: go build ./cmd/ang

      - name: Run Compiler Tests
        run: go test ./compiler/... ./cmd/ang

      - name: Validate the blog sample
        run: go run ./cmd/ang validate examples/blog

      - name: Build the blog sample module
        working-directory: examples/blog
        run: go build ./... && go test ./... -count=1

  architecture-invariants:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Invariant Unit Tests (entity/projection/determinism)
        run: go test ./compiler -run 'TestEntityIntegrity|TestProjectionRules'

      - name: IR Compatibility Gate (migrations + golden contract)
        run: go test ./angir/...

      - name: Policy Parity Gate (backend ↔ OpenAPI ↔ SDK)
        run: go test ./compiler/emitter -run TestPolicyParity_BackendMiddlewareAndSDKMeta

